name: CI

on:
  push:
    branches: ["main", "feature/**", "fix/**", "chore/**"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    working-directory: backend

jobs:
  # ── Job 1: Lint ────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run ruff check
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

  # ── Job 2: Test ────────────────────────────────────────────────────────────
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dev dependencies
        run: uv sync --dev --frozen

      - name: Run pytest with coverage
        run: |
          uv run pytest \
            --cov=app \
            --cov=ai_pipeline \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
        env:
          # Minimal env so config/settings can load without real secrets
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"  # pragma: allowlist secret
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"  # pragma: allowlist secret
          SUPABASE_JWT_SECRET: "ci-test-secret-not-used-in-real-auth"  # pragma: allowlist secret
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/test"  # pragma: allowlist secret
          JWT_SECRET_KEY: "ci-test-jwt-secret-minimum-32-chars-long"  # pragma: allowlist secret
          DIAL_API_KEY: "placeholder"  # pragma: allowlist secret
          DIAL_API_BASE_URL: "https://placeholder.example.com"
          ENVIRONMENT: "test"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: backend/coverage.xml

  # ── Job 3: Docker build check (push to main only) ─────────────────────────
  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: interview-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
