[project]
name = "interview-intelligence-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.14.0",
    "asyncpg==0.30.0",
    "fastapi==0.115.0",
    "httpx==0.28.0",
    "openai==1.57.0",
    "passlib[bcrypt]==1.7.4",
    "pydantic[email]==2.10.0",
    "pydantic-settings==2.7.0",
    "pymupdf==1.25.0",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "tenacity==9.0.0",
    "uvicorn[standard]==0.32.0",
    "bcrypt==4.2.1",
    "langchain-core>=0.3.86",
    "langchain-openai>=0.2.13",
    "langgraph>=1.0.1",
    "langchain>=0.3.30",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "bandit>=1.9.4",
    "httpx>=0.28.0",
    "mypy==1.13.0",
    "pre-commit==4.0.1",
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "pytest-mock==3.14.0",
    "ruff==0.8.0",
    "sqlalchemy[mypy]>=2.0.36",
    "types-passlib>=1.7.7.20260211",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["app", "ai_pipeline"]
omit = ["tests/*", "alembic/*"]
